name: Access gating audit

# Verify every confidential *.anysigma.com surface (and its *-anysigma.pages.dev mirror)
# is behind Cloudflare Access. Pages.dev mirrors must include the wildcard so
# per-deployment preview URLs don't bypass the policy. Public exceptions live in
# .access-public-allowlist at repo root.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN (scoped to Account → Access: Read + Account → Cloudflare Pages: Read + Zone → DNS: Read for anysigma.com)
#   CLOUDFLARE_ACCOUNT_ID (scoped tokens cannot list /accounts; pass the account ID explicitly)
# Alternative for local dev only:
#   CF_API_EMAIL + CF_API_KEY (global key) — fine for local runs, never in CI.

on:
  # Audit fires on EVERY PR, not just changes to its own files. A PR adding
  # a new subdomain mini-site (under subdomains/**) often comes with a new
  # CF Pages project + DNS — we want the audit to catch any new surface
  # that lacks Access before merge, not the day after.
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC (15:00 JST) — catches subdomains created out-of-band.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run audit
        env:
          CI: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: node scripts/audit-access-gating.mjs
